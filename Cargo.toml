[workspace]
resolver = "2"
members = ["crates/t3-client", "crates/t3-gpui"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
t3-client = { path = "crates/t3-client" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
futures = "0.3"
# gpui-kit pins its GPUI snapshot (gpui-pre) exactly and re-exports it as `gpui_kit::*`.
gpui-kit = "0.7.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

# GPUI (layout, text shaping, markdown) is very slow unoptimized. Optimize
# dependencies in dev builds too; our own crates stay quick to rebuild and debug.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
