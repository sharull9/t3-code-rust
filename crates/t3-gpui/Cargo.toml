[package]
name = "t3-gpui"
description = "Native GPUI client for T3 Code"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
gpui-kit.workspace = true
# Already in the tree through chrono's `clock`; names the zone for usage windows.
iana-time-zone = "0.1"
# Already in the tree through GPUI; converts pasted bitmaps to PNG.
image = { version = "0.25", default-features = false, features = ["bmp", "ico", "png", "tiff"] }
serde_json.workspace = true
serde.workspace = true
url.workspace = true
reqwest.workspace = true
t3-client.workspace = true
tokio.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
